<html>
<head>
  <title>Карточки внутри карточек</title>

  <style>
    .section {
      border: 2px solid gray;
      margin: 20px;
      padding: 10px;
      background: #eaeaea;

      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }

    .card {
      border: 2px solid black;
      padding: 10px;
      width: 220px;
      background: #f5f5f5;
    }

    .window {
      border: 1px dashed red;
      margin: 5px;
      padding: 5px;
      transition: 0.3s;
    }

    .w1 { color: blue; font-size: 18px; }
    .w1:hover { transform: scale(1.1); }

    .w2 { background: yellow; font-weight: bold; }
    .w2:hover { background: orange; }

    .w3 { font-style: italic; color: green; }
    .w3:hover { transform: rotate(5deg); }

    .w4 { background: pink; font-family: Courier; }
    .w4:hover { opacity: 0.6; }
  </style>
</head>
<body>

<h1>4 секции → карточки → окошки</h1>

<!-- LocalStorage -->
<input id="text" placeholder="Напиши что-то">
<button onclick="save()">Сохранить</button>

<p>Сохранено:</p>
<div id="out"></div>

<hr>

<!-- 4 секции -->
<div class="section"><h2>Секция 1</h2></div>
<div class="section"><h2>Секция 2</h2></div>
<div class="section"><h2>Секция 3</h2></div>
<div class="section"><h2>Секция 4</h2></div>

<script>
/* ---------------- LOCAL STORAGE ---------------- */
function save() {
  let value = document.getElementById("text").value;
  localStorage.setItem("myValue", value);
  show();
}

function show() {
  document.getElementById("out").innerText = localStorage.getItem("myValue");
}

show();

/* ---------------- ПЕРЕМЕШАТЬ СЕКЦИИ ---------------- */
let sections = document.querySelectorAll(".section");
let arr = Array.from(sections).sort(() => Math.random() - 0.5);
arr.forEach(sec => document.body.appendChild(sec));

/* ---------------- УДАЛИТЬ ВСЕ КАРТОЧКИ И ДОБАВИТЬ 8 НОВЫХ ---------------- */
document.querySelectorAll(".section").forEach(section => {

  // Удаляем старые карточки
  let oldCards = section.querySelectorAll(".card");
  oldCards.forEach(c => c.remove());

  // Добавляем 8 новых карточек
  for (let i = 1; i <= 8; i++) {
    let card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
      <div class="window w1">Окно 1</div>
      <div class="window w2">Окно 2</div>
      <div class="window w3">Окно 3</div>
      <div class="window w4">Окно 4</div>
    `;

    section.appendChild(card);
  }
});
</script>

</body>
</html>
