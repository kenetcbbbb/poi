<!DOCTYPE html>
<html data-lang="ru" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Карточки | WhatrLabel DS</title>
    
    <link rel="stylesheet" href="design-system.css">
    <link rel="stylesheet" href="animations.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<!-- Кнопки управления -->
<div class="controls">
    <button onclick="toggleTheme()">🌓 Тема</button>
    <button onclick="toggleDirection()">🔄 RTL/LTR</button>
    <button onclick="changeLanguage('ru')">🇷🇺 Русский</button>
    <button onclick="changeLanguage('en')">🇬🇧 English</button>
    <button onclick="changeLanguage('de')">🇩🇪 Deutsch</button>
</div>

<h1 id="mainTitle"></h1>

<!-- LocalStorage блок -->
<div class="storage">
    <input type="text" id="textInput" placeholder="">
    <button onclick="saveToStorage()" id="saveBtn"></button>
    <div class="storage-output">
        <span id="savedLabel"></span>
        <span id="savedValue"></span>
    </div>
</div>

<hr>

<!-- Контейнер для 4 секций -->
<div id="sectionsContainer"></div>

<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
