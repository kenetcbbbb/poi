<!DOCTYPE html>
<html lang="ru" data-theme="light" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- дизайн‑система -->
    <link rel="stylesheet" href="./css/design-system.css">

    <!-- основные стили -->
    <link rel="stylesheet" href="./css/styles.css">

    <!-- анимации -->
    <link rel="stylesheet" href="./css/animations.css">

    <title>whatrlabel ui</title>
</head>

<body>
    <div class="wrapper">

        <!-- заголовок страницы -->
        <h1 id="mainTitle">мой проект</h1>

        <!-- поле ввода -->
        <input id="textInput" type="text" placeholder="введите текст...">

        <!-- кнопка сохранить -->
        <button id="saveBtn" onclick="saveToStorage()">сохранить</button>

        <!-- сохранённый текст -->
        <div id="savedLabel">сохранено:</div>
        <div id="savedValue"></div>

        <!-- кнопки управления -->
        <div class="controls">
            <button onclick="toggleTheme()">тема</button>
            <button onclick="toggleDirection()">направление</button>
            <button onclick="changeLanguage('ru')">ru</button>
            <button onclick="changeLanguage('en')">en</button>
        </div>

        <!-- контейнер для секций (js создаёт всё внутри) -->
        <div id="sectionsContainer"></div>

    </div>

    <!-- скрипт для языка -->
    <script src="./languager.js"></script>

    <!-- главный скрипт -->
    <script src="./app.js"></script>
</body>
</html>
