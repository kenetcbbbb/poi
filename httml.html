<!DOCTYPE html>
<html data-lang="ru" dir="ltr">
<!-- 
    data-lang="ru" - указывает что язык сайта русский
    dir="ltr" - направление текста слева направо (left to right)
-->

<head>
    <meta charset="UTF-8">                              <!-- Русские буквы работают -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">  <!-- Адаптив для телефонов -->
    <title>Карточки | WhatrLabel DS</title>            <!-- Заголовок вкладки -->
    
    <!-- Подключаем CSS файлы -->
    <link rel="stylesheet" href="design-system.css">   <!-- Цвета и WhatrLabel -->
    <link rel="stylesheet" href="animations.css">      <!-- Анимации -->
    <link rel="stylesheet" href="styles.css">          <!-- Основные стили -->
</head>
<body>

    <!-- ========== КНОПКИ УПРАВЛЕНИЯ ========== -->
    <div class="controls">
        <!-- onclick - что делать при нажатии -->
        <button onclick="toggleTheme()">Тема</button>           <!-- Меняет светлую/темную тему -->
        <button onclick="toggleDirection()">RTL/LTR</button>    <!-- Меняет направление текста -->
        <button onclick="changeLanguage('ru')">Русский</button>  <!-- Переключить на русский -->
        <button onclick="changeLanguage('en')">English</button> <!-- Переключить на английский -->
        <button onclick="changeLanguage('de')">Deutsch</button> <!-- Переключить на немецкий -->
    </div>

    <!-- ========== ЗАГОЛОВОК ========== -->
    <h1 id="mainTitle"></h1>
    <!-- id="mainTitle" - чтобы менять текст через JavaScript -->

    <!-- ========== LOCALSTORAGE БЛОК (сохранение данных) ========== -->
    <div class="storage">
        <input type="text" id="textInput" placeholder="">  <!-- Поле для ввода текста -->
        <button onclick="saveToStorage()" id="saveBtn"></button>  <!-- Кнопка сохранения -->
        <div class="storage-output">
            <span id="savedLabel"></span>   <!-- Текст "Сохранено:" -->
            <span id="savedValue"></span>   <!-- Само сохраненное значение -->
        </div>
    </div>

    <hr>  <!-- Разделительная линия -->

    <!-- ========== КОНТЕЙНЕР ДЛЯ СЕКЦИЙ ========== -->
    <div id="sectionsContainer"></div>
    <!-- Сюда JavaScript добавит все секции с карточками -->

    <!-- ========== ПОДКЛЮЧАЕМ JAVASCRIPT ========== -->
    <script src="languager.js"></script>  <!-- Сначала переводы -->
    <script src="app.js"></script>    <!-- Потом логику -->
</body>
</html>
